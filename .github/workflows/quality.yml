name: quality

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装公开层依赖
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: 敏感信息扫描（硬门：任何硬违规即失败）
        run: python docs/demo/sensitive_check.py

      - name: 清单一致性 + 构建可复现（产物必须与提交一致）
        shell: pwsh
        run: |
          python docs/demo/sensitive_check.py --sync
          python docs/demo/build_console.py
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host "工作区发生变化（白名单或构建产物与提交不一致）："
            $dirty
            exit 1
          }

      - name: 生成样例假数据
        run: python sample_data/generate_sample_data.py

      - name: 公开脚本与工具测试
        run: python -m pytest docs/demo/tests -q
